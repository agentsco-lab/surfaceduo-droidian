# Surface Duo on Droidian 102: one path to mobile data, not two (#228).
# 102 has the modem twice in NetworkManager: through ModemManager (ofono2mm,
# device /ril_0) and through NetworkManager's own ofono support (device
# ril_0), which makes itself an "internet" connection for the SIM's first
# context and brings it up beside the port's "Mobile data". Both came up on
# the same bearer. The shell's mobile data (phosh wwan-backend 'modemmanager')
# and GNOME Settings' Mobile Network page talk to ModemManager, so that path
# stays and NetworkManager leaves the ofono device alone.
[device-sfduo-ofono]
match-device=driver:ofono
managed=0
