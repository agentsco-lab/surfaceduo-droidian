# The first start of phosh on a boot sometimes ends at once - successfully,
# 70 ms in, before its PAM session opens - and since the vendor composer is
# bound to it (BindsTo both ways) the composer is restarted with it. With
# phosh's own RestartSec of 5 s that cost the lock screen 5-10 s at boot
# (60 s instead of 48). Why it ends is still open; a retry half a second
# later costs half a second.
[Service]
RestartSec=500ms
