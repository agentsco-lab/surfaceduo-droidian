# Droidian's 50-chvt.conf switches to VT 7 in ExecStartPost. phosh.service is
# Type=simple, so systemd runs that chvt a millisecond after spawning phosh,
# while phosh is still taking tty7 over (TTYVHangup) and opening its PAM
# session - and when chvt got there first phosh was killed by SIGHUP
# ("code=killed, status=1/HUP (success)"). It happened at one boot in two;
# three in a row left the phone on the bootloader's logo (2026-09-27). The
# switch is made before phosh starts instead.
[Service]
ExecStartPost=
ExecStartPre=+chvt 7
